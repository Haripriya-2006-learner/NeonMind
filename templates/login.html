{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block auth %}
<section class="card auth-card">
  <div class="logo logo-lg"><span class="logo-mark">N</span>NeonMind</div>
  <p class="muted center">Plan your day, write it down, notice how you feel.</p>
  <form method="post" action="{{ url_for('login') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" value="{{ form.get('email','') }}" autocomplete="email" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-block" type="submit">Log in</button>
  </form>
  <p class="muted center">New here? <a href="{{ url_for('signup') }}">Create account</a></p>
</section>
{% endblock %}
